<svg width="200" height="130" viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">

  <!-- Connections: input → hidden -->
  <g opacity="0.25" stroke="#10b981" stroke-width="1" fill="none">
    <!-- from input node 1 (30,25) -->
    <line x1="30" y1="25" x2="100" y2="15"/>
    <line x1="30" y1="25" x2="100" y2="40"/>
    <line x1="30" y1="25" x2="100" y2="65"/>
    <line x1="30" y1="25" x2="100" y2="90"/>
    <!-- from input node 2 (30,55) -->
    <line x1="30" y1="55" x2="100" y2="15"/>
    <line x1="30" y1="55" x2="100" y2="40"/>
    <line x1="30" y1="55" x2="100" y2="65"/>
    <line x1="30" y1="55" x2="100" y2="90"/>
    <!-- from input node 3 (30,85) -->
    <line x1="30" y1="85" x2="100" y2="15"/>
    <line x1="30" y1="85" x2="100" y2="40"/>
    <line x1="30" y1="85" x2="100" y2="65"/>
    <line x1="30" y1="85" x2="100" y2="90"/>
  </g>

  <!-- Connections: hidden → output -->
  <g opacity="0.25" stroke="#10b981" stroke-width="1" fill="none">
    <!-- from hidden node 1 (100,15) -->
    <line x1="100" y1="15" x2="170" y2="35"/>
    <line x1="100" y1="15" x2="170" y2="70"/>
    <!-- from hidden node 2 (100,40) -->
    <line x1="100" y1="40" x2="170" y2="35"/>
    <line x1="100" y1="40" x2="170" y2="70"/>
    <!-- from hidden node 3 (100,65) -->
    <line x1="100" y1="65" x2="170" y2="35"/>
    <line x1="100" y1="65" x2="170" y2="70"/>
    <!-- from hidden node 4 (100,90) -->
    <line x1="100" y1="90" x2="170" y2="35"/>
    <line x1="100" y1="90" x2="170" y2="70"/>
  </g>

  <!-- Animated "signal" pulses: input → hidden wave -->
  <g stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="30" y1="55" x2="100" y2="40" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="1.8s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="30" y1="25" x2="100" y2="15" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.8s" begin="0.15s" repeatCount="indefinite"/>
    </line>
    <line x1="30" y1="85" x2="100" y2="90" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <!-- hidden → output -->
    <line x1="100" y1="40" x2="170" y2="35" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="1.8s" begin="0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="15" x2="170" y2="70" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.8s" begin="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="90" x2="170" y2="35" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.8s" begin="0.65s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Input nodes -->
  <g fill="#10b981">
    <circle cx="30" cy="25" r="5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="55" r="5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="85" r="5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Hidden nodes -->
  <g fill="#34d399">
    <circle cx="100" cy="15" r="4.5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" begin="0.55s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="40" r="4.5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" begin="0.65s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="65" r="4.5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" begin="0.75s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="90" r="4.5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" begin="0.85s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Output nodes -->
  <g fill="#06b6d4">
    <circle cx="170" cy="35" r="6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;8;6" dur="1.8s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="70" r="6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;8;6" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Layer labels -->
  <g font-family="JetBrains Mono, monospace" font-size="8" fill="#333333" text-anchor="middle">
    <text x="30" y="104">input</text>
    <text x="100" y="104">hidden</text>
    <text x="170" y="104">output</text>
  </g>

  <!-- Loading text -->
  <text x="100" y="122" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500"
    fill="#10b981" text-anchor="middle" letter-spacing="3" opacity="0.7">
    LOADING
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.8s" repeatCount="indefinite"/>
  </text>

</svg>
